name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: Windows and Linux
            script: Publish-Avalonia.sh
            artifact: NxFileViewer-win-linux
            files: Publish/*.zip
          - name: Linux AppImages
            script: Publish-Avalonia-appimage.sh
            artifact: NxFileViewer-appimage
            files: Publish/*.AppImage
          - name: macOS
            script: Publish-Avalonia-macos.sh
            artifact: NxFileViewer-macos
            files: Publish/*.dmg
    name: Publish ${{ matrix.target.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v="${GITHUB_REF_NAME}"
          v="${v#v}"
          if [ -z "$v" ]; then
            exit 1
          fi
          echo "VERSION=${v}" >> "$GITHUB_ENV"
          echo "Using version ${v}"

      - name: Publish ${{ matrix.target.name }}
        run: sh ./${{ matrix.target.script }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.artifact }}
          path: ${{ matrix.target.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
