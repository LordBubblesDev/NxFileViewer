name: Test AppImage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish AppImages
        run: sh ./Publish-Avalonia-appimage.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NxFileViewer-appimage
          path: Publish/*.AppImage
          if-no-files-found: error
