name: Test macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Publish macOS
        run: sh ./Publish-Avalonia-macos.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NxFileViewer-macos
          path: Publish/*.dmg
          if-no-files-found: error
